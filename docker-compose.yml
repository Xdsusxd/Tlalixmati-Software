version: '3.8'

services:
  # === Servicio Web (Next.js) ===
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_KEY}
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    depends_on:
      - api

  # === Servicio API (FastAPI) ===
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/api/app:/app/apps/api/app
      - ./packages:/app/packages
      - ./config:/app/config
    restart: unless-stopped

# Nota: No incluimos una base de datos local aquí ya que Tlalixmati utiliza Supabase (cloud)
